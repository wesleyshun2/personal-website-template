name: Sync Musings

on:
  schedule:
    # 每天 UTC 時間 00:00 (台灣時間 08:00) 執行一次
    - cron: '0 0 * * *'
  # 允許您在 GitHub 網頁上手動點擊執行
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write # 允許機器人提交更改到您的儲存庫

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 獲取完整紀錄，確保時間比對精準

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Sync Bluesky Posts
        run: npm run sync-musings

      - name: Commit and push changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add content/
          # 如果沒有新文章，它不會進行 commit 並會順利結束
          git commit -m "chore: auto-sync musings from Bluesky" || echo "No new musings to sync"
          git push
